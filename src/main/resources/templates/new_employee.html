<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Add Employee</h2>

    <form th:action="@{/saveEmployee}" th:object="${employee}" method="post">

        <div class="mb-3">
            <label>First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Department</label>
            <input type="text" th:field="*{department}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Save Employee</button>

        <a th:href="@{/}" class="btn btn-secondary">Back</a>

    </form>

</div>

</body>
</html>
